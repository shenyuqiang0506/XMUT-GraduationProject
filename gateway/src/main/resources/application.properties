# 服务名同时作为注册中心实例名与 Nacos 配置 dataId 前缀。
spring.application.name=gateway
server.port=${SERVER_PORT:8081}
# 默认只绑定回环地址，外部流量必须经由反向代理进入。
server.address=${SERVER_ADDRESS:127.0.0.1}
# dev/prod 均需外部配置与注册中心，统一叠加 nacos profile 避免逐处声明。
spring.profiles.group.dev=nacos
spring.profiles.group.prod=nacos
# 本地与测试默认关闭 Nacos，仅由 nacos profile 显式开启。
spring.cloud.nacos.discovery.enabled=false
spring.cloud.nacos.config.enabled=false
spring.cloud.nacos.config.import-check.enabled=false
# 网关对外暴露面最小化：只开放健康与信息端点，且健康详情不外泄内部组件状态。
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
