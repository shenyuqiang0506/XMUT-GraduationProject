spring.application.name=identity-service
server.port=${SERVER_PORT:8083}
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.profiles.group.dev=nacos
spring.profiles.group.prod=nacos
spring.cloud.nacos.discovery.enabled=false
spring.cloud.nacos.config.enabled=false
spring.cloud.nacos.config.import-check.enabled=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
spring.datasource.url=${IDENTITY_DB_URL:jdbc:mysql://127.0.0.1:3306/identity_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${IDENTITY_DB_USERNAME:}
spring.datasource.password=${IDENTITY_DB_PASSWORD:}
spring.flyway.enabled=false
