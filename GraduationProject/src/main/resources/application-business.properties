spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
spring.datasource.hikari.connection-timeout=3000
# 取得资源锁后读取最新提交的来源、配额与占用；查询快照方法自行声明 REPEATABLE_READ。
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
# 固定请求 schema：未知字段和小数转整数不能被静默忽略。
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false

# 独立调度线程避免 RabbitMQ 的有界等待延迟预约到期与候补补偿。
spring.task.scheduling.pool.size=4
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms
spring.rabbitmq.connection-timeout=2s

# 建立/关闭通道本身也需要等待 broker；仅设置连接与发布确认超时不能覆盖这一段。
spring.rabbitmq.channel-rpc-timeout=3s
spring.rabbitmq.requested-heartbeat=10s
