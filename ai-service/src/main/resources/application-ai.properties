spring.ai.model.chat=openai
spring.ai.openai.api-key=${AI_API_KEY}
spring.ai.openai.base-url=${AI_BASE_URL}
spring.ai.openai.chat.model=${AI_MODEL}
spring.ai.openai.timeout=${AI_TIMEOUT:6s}
spring.ai.openai.chat.timeout=${AI_TIMEOUT:6s}
spring.ai.openai.chat.max-retries=0
spring.ai.openai.max-retries=0
spring.ai.retry.max-attempts=1
spring.ai.openai.chat.max-tokens=1200
spring.ai.openai.chat.temperature=0
spring.ai.openai.chat.store=false
spring.ai.openai.chat.response-format.type=JSON_OBJECT
spring.ai.openai.chat.extra-body.thinking.type=disabled
spring.ai.openai.chat.parallel-tool-calls=false
