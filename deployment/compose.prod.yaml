# Single-host production infrastructure template. Only loopback admin access;
# connect through SSH tunnels. Future app containers use service DNS/internal ports.
services:
  mysql:
    ports: ['127.0.0.1:13306:3306']
  redis:
    ports: ['127.0.0.1:16379:6379']
  rabbitmq:
    ports: ['127.0.0.1:15673:5672', '127.0.0.1:25672:15672']
  nacos:
    ports: ['127.0.0.1:18848:8848', '127.0.0.1:19848:9848', '127.0.0.1:18088:8080']
