x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'
services:
  mysql:
    <<: *service
    image: ${MYSQL_IMAGE:?Set MYSQL_IMAGE}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Generate credentials first}
      MYSQL_ROOT_HOST: localhost
      IDENTITY_DB_USER: ${IDENTITY_DB_USER:?}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?}
      BOOKING_DB_USER: ${BOOKING_DB_USER:?}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:?}
      AI_DB_USER: ${AI_DB_USER:?}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:?}
      NOTIFICATION_DB_USER: ${NOTIFICATION_DB_USER:?}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?}
      TZ: UTC
    # Copy the init script into the container to avoid bind-mount executable-bit
    # differences on Docker Desktop. The official entrypoint then sources it.
    entrypoint: ['bash', '-c', 'cp /opt/bootstrap/01-create-databases.sh /docker-entrypoint-initdb.d/01-create-databases.sh; chmod 0644 /docker-entrypoint-initdb.d/01-create-databases.sh; exec /usr/local/bin/docker-entrypoint.sh "$$@"', '--']
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_0900_ai_ci', '--default-time-zone=+00:00']
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/01-create-databases.sh:/opt/bootstrap/01-create-databases.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD="$${BOOKING_DB_PASSWORD}" mysql -h127.0.0.1 -u"$${BOOKING_DB_USER}" booking_db -Nse "SELECT 1" | grep -qx 1']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  redis:
    <<: *service
    image: ${REDIS_IMAGE:?Set REDIS_IMAGE}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    command: ['sh', '-c', 'exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 12
  rabbitmq:
    <<: *service
    image: ${RABBITMQ_IMAGE:?Set RABBITMQ_IMAGE}
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:?}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_running']
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s
  nacos:
    <<: *service
    image: ${NACOS_IMAGE:?Set NACOS_IMAGE}
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: 'true'
      NACOS_AUTH_ADMIN_ENABLE: 'true'
      NACOS_AUTH_CONSOLE_ENABLE: 'true'
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:?}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?}
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
      TZ: Asia/Shanghai
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8848/nacos/v3/admin/core/state/readiness | grep -q "ok"']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  nacos-data:
  nacos-logs:
